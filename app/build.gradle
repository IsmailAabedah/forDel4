plugins {
    id "com.android.application"
}

android {
    namespace "com.ismail.zhonghonglab"
    compileSdk 35

    defaultConfig {
        applicationId "com.ismail.zhonghonglab"
        minSdk 21
        targetSdk 22
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
