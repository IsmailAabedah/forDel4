name: Android 7 legacy APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Java 17 for current Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install isolated Android 7-era SDK
        run: |
          set -euo pipefail
          HOST_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$HOST_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"

          LEGACY_SDK="$RUNNER_TEMP/android-sdk-legacy"
          mkdir -p "$LEGACY_SDK"
          yes | "$SDKMANAGER" --sdk_root="$LEGACY_SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$LEGACY_SDK" "platforms;android-25" "build-tools;25.0.3"

          echo "ANDROID_HOME=$LEGACY_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$LEGACY_SDK" >> "$GITHUB_ENV"
      - name: Select Java 8 for the legacy Gradle toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'
      - name: Inspect working CarCheck reference
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/25.0.3/aapt" dump badging reference/CarCheck-v1.1.apk
          unzip -t reference/CarCheck-v1.1.apk
      - name: Build with legacy Android Gradle Plugin
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify standalone APK package
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          REPORT="app/build/reports/legacy-apk"
          mkdir -p "$REPORT"
          AAPT="$ANDROID_HOME/build-tools/25.0.3/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/25.0.3/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/25.0.3/zipalign"

          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee "$REPORT/badging.txt"
          grep -F "package: name='com.ismail.zhonghonglab'" "$REPORT/badging.txt"
          grep -F "sdkVersion:'19'" "$REPORT/badging.txt"
          grep -F "targetSdkVersion:'22'" "$REPORT/badging.txt"

          DEX_COUNT="$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$')"
          test "$DEX_COUNT" -eq 1
          if unzip -Z1 "$APK" | grep -q '^lib/'; then
            echo "Unexpected native libraries in APK" >&2
            exit 1
          fi

          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 19 --max-sdk-version 25 "$APK" | tee "$REPORT/signature.txt"
          grep -F "Verified using v1 scheme (JAR signing): true" "$REPORT/signature.txt"
          unzip -t "$APK"
          sha256sum "$APK" | tee "$REPORT/sha256.txt"
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: zhonghong-integration-lab-legacy-android7-v1.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
