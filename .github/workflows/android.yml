name: Android build and compatibility checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
      - name: Install legacy Android SDK platform and build tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-28" "build-tools;30.0.3"
      - name: Inspect known-working CarCheck package
        run: |
          set -euo pipefail
          sha256sum reference/CarCheck-v1.1.apk reference/CarCheck-jadx-sources.zip
          "$ANDROID_HOME/build-tools/30.0.3/aapt" dump badging reference/CarCheck-v1.1.apk
          unzip -t reference/CarCheck-v1.1.apk
      - name: Build legacy-compatible debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK for Android 7.x
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          REPORT_DIR="app/build/reports/compatibility"
          mkdir -p "$REPORT_DIR"
          AAPT="$ANDROID_HOME/build-tools/30.0.3/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/30.0.3/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/30.0.3/zipalign"

          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee "$REPORT_DIR/apk-badging.txt"
          grep -F "package: name='com.ismail.zhonghonglab.debug'" "$REPORT_DIR/apk-badging.txt"
          grep -F "sdkVersion:'21'" "$REPORT_DIR/apk-badging.txt"
          grep -F "targetSdkVersion:'22'" "$REPORT_DIR/apk-badging.txt"

          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 21 --max-sdk-version 25 "$APK" | tee "$REPORT_DIR/apk-signature.txt"
          grep -F "Verified using v1 scheme (JAR signing): true" "$REPORT_DIR/apk-signature.txt"
          unzip -t "$APK"
          sha256sum "$APK" | tee "$REPORT_DIR/apk-sha256.txt"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhonghong-integration-lab-android7-v0.1.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
