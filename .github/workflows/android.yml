          done
          [ "$BOOTED" = "1" ] || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }

          "$ADB" install -r reference/CarCheck-v1.1.apk

          set +e
          "$ADB" install -r "$APK" > "$RUNNER_TEMP/install-original.txt" 2>&1
          ORIGINAL_RC=$?
          set -e
          cat "$RUNNER_TEMP/install-original.txt"
          if [ "$ORIGINAL_RC" -ne 0 ]; then
            echo "Original APK install failed; normalize DOS ZIP timestamps and retry."
            python3 - "$APK" <<'PY'
          import sys, zipfile, struct
          p=sys.argv[1]
          dos_time=0
          dos_date=(1<<5)|1
          with zipfile.ZipFile(p) as z:
